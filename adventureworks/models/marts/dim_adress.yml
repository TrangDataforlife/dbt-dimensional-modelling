version: 2

models:
  - name: dim_address
    columns:
      - name: address_key 
        description: The surrogate key of the address
        data_tests:
          - not_null
          - unique
      - name: addressid 
        description: The natural key of the address
        data_tests:
          - not_null
          - unique
      - name: addressline1 
        description: The first line of the address
        tests:
          - not_null