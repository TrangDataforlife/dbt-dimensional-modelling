version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        description: The surrogate key of the customer
        data_tests:
          - not_null
          - unique
      - name: customer_id 
        description: The natural key of the customer
        data_tests:
          - not_null
          - unique
      - name: person_id 
        description: The natural key of the person
        data_tests:
          - not_null
          - unique
      - name: store_id 
        description: The natural key of the store
        data_tests:
          - not_null
          - unique